name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack leads API
        run: |
          mkdir -p leads-pack
          cp server/leads-api/index.js server/leads-api/package.json leads-pack/
          cp deploy/nginx-leads.conf deploy/vkrysha-leads.service deploy/vkrysha-leads.env.example leads-pack/
          tar -czf leads-api.tar.gz -C leads-pack .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: leads-api
          path: leads-api.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: leads-api
          path: .

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "dist/*"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "leads-api.tar.gz"
          target: /home/${{ secrets.SERVER_USER }}/vkrysha-leads-upload
          overwrite: true
          rm: true

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi

            LEADS_DIR=/var/www/vkrysha-leads
            DATA_DIR=/var/lib/vkrysha-leads
            ENV_FILE=/etc/vkrysha-leads.env
            UNIT_FILE=/etc/systemd/system/vkrysha-leads.service
            NGINX_SNIPPET=/etc/nginx/snippets/vkrysha-leads.conf
            UPLOAD="$HOME/vkrysha-leads-upload"
            UNPACK="$HOME/vkrysha-leads-unpack"
            TAR="$UPLOAD/leads-api.tar.gz"

            rm -rf "$UNPACK"
            mkdir -p "$UNPACK"
            $SUDO mkdir -p "$LEADS_DIR" "$DATA_DIR" /etc/nginx/snippets
            tar -xzf "$TAR" -C "$UNPACK"

            $SUDO cp "$UNPACK/index.js" "$LEADS_DIR/index.js"
            $SUDO cp "$UNPACK/package.json" "$LEADS_DIR/package.json"
            $SUDO cp "$UNPACK/vkrysha-leads.service" "$UNIT_FILE"
            $SUDO cp "$UNPACK/nginx-leads.conf" "$NGINX_SNIPPET"

            if [ ! -f "$ENV_FILE" ]; then
              TOKEN=$(openssl rand -hex 32)
              printf 'LEADS_API_TOKEN=%s\nLEADS_HOST=127.0.0.1\nLEADS_PORT=8787\nLEADS_DATA_DIR=%s\n' "$TOKEN" "$DATA_DIR" | $SUDO tee "$ENV_FILE" >/dev/null
              $SUDO chmod 640 "$ENV_FILE"
              echo "Created $ENV_FILE"
              echo "LEADS_API_TOKEN=$TOKEN"
            fi

            if ! command -v node >/dev/null 2>&1; then
              echo "Installing Node.js 22..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | $SUDO bash -
              $SUDO apt-get install -y nodejs
            fi
            NODE_BIN=$(command -v node)
            echo "Using node: $NODE_BIN ($($NODE_BIN -v))"
            $SUDO sed -i "s|^ExecStart=.*|ExecStart=$NODE_BIN $LEADS_DIR/index.js|" "$UNIT_FILE"

            $SUDO chown -R www-data:www-data "$LEADS_DIR" "$DATA_DIR" || true
            $SUDO chmod 640 "$ENV_FILE" || true
            $SUDO chown root:www-data "$ENV_FILE" || true

            $SUDO systemctl daemon-reload
            $SUDO systemctl enable vkrysha-leads
            $SUDO systemctl restart vkrysha-leads
            sleep 1
            if ! $SUDO systemctl is-active --quiet vkrysha-leads; then
              echo "vkrysha-leads failed to start:"
              $SUDO journalctl -u vkrysha-leads -n 50 --no-pager || true
              exit 1
            fi

            if ! grep -Rqs "snippets/vkrysha-leads.conf" /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null; then
              echo "WARNING: add to site server block BEFORE CRM /api proxy:"
              echo "    include /etc/nginx/snippets/vkrysha-leads.conf;"
            fi

            $SUDO nginx -t
            $SUDO systemctl reload nginx
            curl -sS -o /dev/null -w "health:%{http_code}\n" http://127.0.0.1:8787/health
            echo "Deploy complete!"
