# Include inside the site's server { } block, BEFORE any catch-all /api proxy.
# Replace CHANGE_ME with the token from CRM (Сайт → Catalog API URL).
# The frontend calls /api/site-catalog — the token never reaches the browser.

location = /api/site-catalog {
    proxy_ssl_server_name on;
    proxy_ssl_name vkrysha-crm.ru;
    proxy_set_header Host vkrysha-crm.ru;
    proxy_pass https://vkrysha-crm.ru/api/feed-services/site/catalog?token=CHANGE_ME&$args;
}

location ~ ^/api/site-catalog/([^/]+)$ {
    proxy_ssl_server_name on;
    proxy_ssl_name vkrysha-crm.ru;
    proxy_set_header Host vkrysha-crm.ru;
    proxy_pass https://vkrysha-crm.ru/api/feed-services/site/catalog/$1?token=CHANGE_ME&$args;
}
