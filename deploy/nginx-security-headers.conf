# Include inside HTTPS server { } for vkrysha.ru:
#   include /etc/nginx/snippets/vkrysha-security-headers.conf;
#
# NOTE: any location that sets its own add_header must re-include these
# (nginx does not inherit parent add_header into such locations).

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Compatible CSP for current SPA: Vite bundle, CRM images, Yandex Maps iframe.
# Tighten later only after console/Network verification.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://vkrysha-crm.ru; font-src 'self' data:; connect-src 'self'; frame-src https://yandex.ru https://*.yandex.ru; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# HSTS — optional; HTTPS already stable via Certbot. Uncomment if desired:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
